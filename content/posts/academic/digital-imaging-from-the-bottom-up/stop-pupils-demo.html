<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperture Stop &amp; Pupils Demo</title>
<link rel="stylesheet" href="/css/demo-lib.css">
<style>
  .readout .a{color:#f6a72b;} .readout .c{color:#31c9ba;}
</style>
</head>
<body>
<canvas id="cvS" height="360" aria-label="Aperture stop and pupils simulation"></canvas>
<div class="controls">
  <div class="ctrl">
    <label>Stop position t <output id="ost">26</output></label>
    <input type="range" id="rst" min="20" max="32" value="26" step="0.5">
  </div>
  <div class="ctrl">
    <label>Stop radius a <output id="osa">7</output></label>
    <input type="range" id="rsa" min="4" max="10" value="7" step="0.5">
  </div>
</div>
<div class="readout" id="roS"></div>

<script src="/js/demo-lib.js"></script>
<script>
"use strict";
function lensGlyph(ctx,sx,cy,halfHpx,color){
  ctx.strokeStyle=color; ctx.lineWidth=1.6; ctx.fillStyle='rgba(110,168,232,.08)';
  ctx.beginPath();
  ctx.moveTo(sx,cy-halfHpx);
  ctx.quadraticCurveTo(sx+10,cy,sx,cy+halfHpx);
  ctx.quadraticCurveTo(sx-10,cy,sx,cy-halfHpx);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

/* Two thin lenses: L1 at x=0 (f1=100), L2 at x=40 (f2=30); a physical stop sits between them */
const D={x0:-95, f1:100, L2:40, f2:30, sensor:60};
const cvS=document.getElementById('cvS');
const rst=document.getElementById('rst'), rsa=document.getElementById('rsa');

/* Paraxial trace: (y0,u0) at x0 -> L1 -> stop plane -> L2 -> sensor */
function trace(y0,u0,t){
  const pts=[[D.x0,y0]];
  let y=y0+u0*(0-D.x0), u=u0;
  pts.push([0,y]);
  u=u-y/D.f1;
  const yStop=y+u*t;
  pts.push([t,yStop]);
  const y2=y+u*D.L2;
  pts.push([D.L2,y2]);
  const u2=u-y2/D.f2;
  const yS=y2+u2*(D.sensor-D.L2);
  pts.push([D.sensor,yS]);
  return {pts,yStop,u2,y2,yS,yL1:pts[1][1]};
}
/* Height at the stop is linear in y0: solve for the ray that hits a given stop height */
function solveY0(u0,t,target){
  const a=trace(0,u0,t).yStop, b=trace(1,u0,t).yStop;
  return (target-a)/(b-a);
}

function drawS(){
  const {ctx,W,H}=fit(cvS);
  const t=+rst.value, a=+rsa.value;
  document.getElementById('ost').textContent=t;
  document.getElementById('osa').textContent=a;

  const xmin=-102,xmax=74;
  const X=x=>(x-xmin)/(xmax-xmin)*(W-24)+12;
  const cy=H*0.5, Y=y=>cy-y*(H*0.40)/30;

  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#243349'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(10,cy); ctx.lineTo(W-10,cy); ctx.stroke();

  /* Pupils = images of the stop formed by the lens group on each side */
  const xEP=D.f1*t/(D.f1-t);
  const rEP=a*Math.abs(D.f1/(D.f1-t));
  const d2=D.L2-t;
  const v=D.f2*d2/(d2-D.f2);
  const xXP=D.L2+v;
  const rXP=a*Math.abs(D.f2/(d2-D.f2));

  lensGlyph(ctx,X(0),cy,H*0.365,'#6ea8e8');
  lensGlyph(ctx,X(D.L2),cy,H*0.296,'#6ea8e8');
  label(ctx,'L1',X(0)-8,cy-H*0.365-8,'#6ea8e8');
  label(ctx,'L2',X(D.L2)-8,cy-H*0.296-8,'#6ea8e8');

  ctx.fillStyle='#55617a';
  const topY=Y(30), botY=Y(-30);
  ctx.fillRect(X(t)-3,topY,6,Y(a)-topY);
  ctx.fillRect(X(t)-3,Y(-a),6,botY-Y(-a));
  label(ctx,'Aperture stop',X(t)-46,botY+16,'#8b97ad');

  ctx.fillStyle='#c3ccdb';
  ctx.fillRect(X(D.sensor)-2,Y(14),4,Y(-14)-Y(14));
  label(ctx,'Sensor',X(D.sensor)-20,Y(-14)+18,'#c3ccdb');

  /* Two ray bundles: on-axis and one off-axis field point */
  const bundles=[
    {u0:0,color:'#a8e05f'},
    {u0:Math.tan(-10*Math.PI/180),color:'#ff7fa5'}
  ];
  bundles.forEach(b=>{
    /* marginal rays: graze the stop edges, and it is their extensions that build the pupils */
    [a,-a].forEach(edge=>{
      const y0=solveY0(b.u0,t,edge);
      const tr=trace(y0,b.u0,t);
      ctx.strokeStyle=b.color; ctx.globalAlpha=.35; ctx.lineWidth=1.3; dash(ctx,false);
      ctx.beginPath();
      tr.pts.forEach((p,i)=> i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));
      ctx.stroke(); ctx.globalAlpha=1;

      /* Where the ray *appears* to come from / go to when the glass is ignored.
         Extending the incoming segment past L1 lands on the EP edge, and running the
         outgoing segment back past L2 lands on the XP edge — exactly, for every field
         angle. That coincidence is what "pupil = image of the stop" means. */
      ctx.globalAlpha=.45; ctx.lineWidth=1.1; dash(ctx,true);
      ctx.strokeStyle='#f6a72b';
      ctx.beginPath();
      ctx.moveTo(X(0),Y(tr.yL1));
      ctx.lineTo(X(xEP),Y(tr.yL1+b.u0*xEP));
      ctx.stroke();
      ctx.strokeStyle='#31c9ba';
      ctx.beginPath();
      ctx.moveTo(X(D.L2),Y(tr.y2));
      ctx.lineTo(X(xXP),Y(tr.y2+tr.u2*(xXP-D.L2)));
      ctx.stroke();
      dash(ctx,false); ctx.globalAlpha=1;

      /* the grazing point itself */
      ctx.fillStyle=b.color;
      ctx.beginPath(); ctx.arc(X(t),Y(edge),2.6,0,7); ctx.fill();
    });
    /* chief ray: through the stop center */
    const y0c=solveY0(b.u0,t,0);
    const tr=trace(y0c,b.u0,t);
    ctx.strokeStyle=b.color; ctx.lineWidth=2.2;
    ctx.beginPath();
    tr.pts.forEach((p,i)=> i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));
    ctx.stroke();

    /* extensions of the off-axis chief ray: object side aims at EP, image side leaves XP */
    if(Math.abs(b.u0)>1e-9){
      dash(ctx,true); ctx.strokeStyle='#f6a72b'; ctx.lineWidth=1.4;
      const xCross=-tr.yL1/b.u0;
      ctx.beginPath();
      ctx.moveTo(X(0),Y(tr.yL1));
      ctx.lineTo(X(Math.min(xCross+6,72)),Y(tr.yL1+b.u0*Math.min(xCross+6,72)));
      ctx.stroke();
      ctx.strokeStyle='#31c9ba';
      const xC2=D.L2-tr.y2/tr.u2;
      const xTo=Math.max(xC2-6,xmin+4);
      ctx.beginPath();
      ctx.moveTo(X(D.L2),Y(tr.y2));
      ctx.lineTo(X(xTo),Y(tr.y2+tr.u2*(xTo-D.L2)));
      ctx.stroke();
      dash(ctx,false);
    }
  });

  function pupilMark(x,r,color,name,below){
    dash(ctx,true); ctx.strokeStyle=color; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(X(x),Y(r)); ctx.lineTo(X(x),Y(-r)); ctx.stroke();
    dash(ctx,false);
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(X(x),cy,3.4,0,7); ctx.fill();
    /* edges: every marginal-ray extension converges on these two points */
    [r,-r].forEach(e=>{ ctx.beginPath(); ctx.arc(X(x),Y(e),3.2,0,7); ctx.fill(); });
    label(ctx,name,X(x)-name.length*3.6,below?Y(-r)+18:Y(r)-10,color,12.5);
  }
  pupilMark(xEP,rEP,'#f6a72b','Entrance pupil',false);
  pupilMark(xXP,rXP,'#31c9ba','Exit pupil',true);

  document.getElementById('roS').innerHTML=
    `Physical stop    x=${t.toFixed(1)}   radius ${a.toFixed(1)}\n`+
    `<span class="a">Entrance pupil   x=${xEP.toFixed(1)}   radius ${rEP.toFixed(1)}   (×${(rEP/a).toFixed(2)}) — the stop imaged by the front lens</span>\n`+
    `<span class="c">Exit pupil       x=${xXP.toFixed(1)}   radius ${rXP.toFixed(1)}   (×${(rXP/a).toFixed(2)}) — the stop imaged by the rear lens</span>\n`+
    `Marginal rays graze the stop edge (dots). Extend them with the glass ignored — dashed —\n`+
    `and they land on the pupil edges; the chief rays through the stop centre land on the centres.\n`+
    `Both hold for every field angle: that is the whole content of "a pupil is the stop, imaged".`+
    (xXP<0?`\nNote: XP now floats in front of the whole system — pupils are virtual images, this is not an error`:``);
}

[rst,rsa].forEach(el=>el.addEventListener('input',drawS));
let rzS;
window.addEventListener('resize',()=>{clearTimeout(rzS);rzS=setTimeout(drawS,120);});
drawS();
</script>
</body>
</html>
