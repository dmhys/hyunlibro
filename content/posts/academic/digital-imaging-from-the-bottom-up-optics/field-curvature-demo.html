<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Curvature Demo</title>
<link rel="stylesheet" href="/css/demo-lib.css">
<style>#cvS{margin-top:8px}</style>
</head>
<body>
<canvas id="cvR" height="288" data-t-aria="ariaR"></canvas>
<canvas id="cvS" height="176" data-t-aria="ariaS"></canvas>
<div class="controls">
  <div class="ctrl">
    <label><span data-t="aLbl"></span> <output id="oap">1.00</output></label>
    <input type="range" id="rap" min="0.2" max="1" value="1" step="0.02">
  </div>
  <div class="ctrl">
    <label><span data-t="zLbl"></span> <output id="oz">0.00</output></label>
    <input type="range" id="rz" min="-1.3" max="0.3" value="0" step="0.01">
  </div>
</div>
<div class="readout" id="ro"></div>

<script src="/js/demo-lib.js"></script>
<script>
"use strict";
/* Third-order field curvature, W = D h^2 rho^2. Its pupil gradient is 2 D h^2 rho:
   a plain defocus whose amount grows with the square of field height. So every field
   point still focuses to a point — just not all at the same distance. The locus of
   those focus points is the Petzval surface, and eliminating h between

       x(h) = -D h^2      (how far the focus sits from the on-axis one)
       y(h) =  h          (how high up the field it is)

   leaves x proportional to -y^2: a parabola. The sensor is a straight line, so it can
   only ever meet that parabola at one radius.

   Unlike the coma and astigmatism demos, colour here encodes FIELD HEIGHT, not pupil
   radius — the pupil plays no part in this aberration beyond setting the blur size. */
const T = i18n({
  en:{ ariaR:'Curved focal surface against a flat sensor',
       ariaS:'Spot diagram across field height',
       aLbl:'Aperture opening', zLbl:'Lens travel',
       pupilPlane:'aperture', imgPlane:'sensor', petzval:'focal surface (curved)',
       field:'field height h  —  centre to corner, one shared scale', nowhere:'no field is in focus',
       note:'colour is field height · each bundle still focuses to a point, just not all at the same distance',
       ro1:'Every field height focuses cleanly — but each at its own distance, and the locus of those\nfocus points is a parabola. The sensor is flat, so it crosses that parabola at exactly one\nradius: sharp there, defocused everywhere else.',
       ro2:'Sharp radius h =' },
  ko:{ ariaR:'휘어진 초점면과 평평한 센서',
       ariaS:'상높이별 스폿 다이어그램',
       aLbl:'조리개 개방', zLbl:'렌즈 이동',
       pupilPlane:'조리개', imgPlane:'센서', petzval:'초점면 (휘어 있다)',
       field:'상높이 h  —  중심에서 모서리까지, 배율 동일', nowhere:'초점 맞는 상고 없음',
       note:'색은 상높이 · 각 다발은 여전히 한 점에 모인다. 다만 모이는 거리가 저마다 다를 뿐이다',
       ro1:'상높이마다 빛은 여전히 깔끔하게 한 점에 모인다. 다만 모이는 거리가 제각각이고, 그 초점들이\n그리는 자취가 포물선이다. 센서는 평평하므로 그 포물선과 오직 한 반지름에서만 만난다.\n거기만 선명하고 나머지는 전부 흐리다.',
       ro2:'선명한 상고 h =' }
});

const D=1.0;
const FIELDS=[0,0.25,0.5,0.75,1.0];
const FCOL=['#6ea8e8','#31c9ba','#a8e05f','#f6a72b','#ff7fa5'];

/* Transverse aberration: a defocus of (dz + D h^2), uniform over the pupil. */
function aber(px,py,h,dz){
  const k=2*(dz+D*h*h);
  return [k*px, k*py];
}
const fieldFocus = h => -D*h*h;      /* defocus at which field h is sharp */

function refExtent(){
  let m=1e-9;
  for(let i=0;i<=16;i++){
    const dz=-1.3+1.6*i/16;
    for(const h of FIELDS) m=Math.max(m,Math.abs(aber(1,0,h,dz)[0]));
  }
  return m;
}

function drawPath(dz,ap){
  const {ctx,W,H}=fit(document.getElementById('cvR'));
  ctx.clearRect(0,0,W,H);
  const cy=H*0.50;
  /* Field curvature in a real lens is a small fraction of the focal length, so the
     pupil-to-focus distance has to dwarf the sag of the focal surface. Otherwise the
     chief ray picks up a large magnification change on its way to the sensor and the
     corner image height balloons, which is a drawing artefact, not the aberration. */
  const x0=40, xSen=520, PUPD=400, ZSC=55, xEnd=W-24;
  const RP=H*0.17, IMG=H*0.19, SENH=H*0.29;
  const SCALE=ZSC*RP/(2*PUPD);
  const xFoc=xSen-dz*ZSC, xPup=xFoc-PUPD;

  ctx.strokeStyle='#243349'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x0,cy); ctx.lineTo(xEnd,cy); ctx.stroke();

  /* aperture plane */
  ctx.strokeStyle='#6ea8e8'; ctx.lineWidth=1.6; ctx.globalAlpha=.85;
  ctx.beginPath(); ctx.moveTo(xPup,cy-RP*1.2); ctx.lineTo(xPup,cy+RP*1.2); ctx.stroke();
  ctx.globalAlpha=1;
  ctx.strokeStyle='#c3ccdb'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(xPup,cy-ap*RP); ctx.lineTo(xPup,cy+ap*RP); ctx.stroke();
  label(ctx,T.pupilPlane,xPup-16,cy+RP*1.2+15,'#6ea8e8',10.5);

  /* the focal surface: x = xFoc - D h^2 ZSC, y = cy -+ h IMG  →  a parabola */
  ctx.strokeStyle='#e8edf6'; ctx.lineWidth=1.5; ctx.globalAlpha=.8;
  ctx.beginPath();
  for(let i=-60;i<=60;i++){
    const h=i/60, x=xFoc+fieldFocus(Math.abs(h))*ZSC, y=cy-h*IMG;
    i===-60?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.globalAlpha=1;
  label(ctx,T.petzval,xFoc-ZSC-4,cy-IMG-12,'#e8edf6',10.5);

  /* one converging bundle per field height: chief ray plus the two rim rays */
  FIELDS.forEach((h,i)=>{
    const xf=xFoc+fieldFocus(h)*ZSC, yf=cy-h*IMG;
    ctx.strokeStyle=FCOL[i];
    [0,1,-1].forEach(s=>{
      const yp=cy-s*ap*RP;
      const sl=(yf-yp)/(xf-xPup);
      ctx.lineWidth=s?1.2:1.6; ctx.globalAlpha=s?.7:.95; dash(ctx,!s&&false);
      ctx.beginPath();
      ctx.moveTo(x0, yp-sl*(xPup-x0));
      ctx.lineTo(xPup, yp);
      ctx.lineTo(xEnd, yf+sl*(xEnd-xf));
      ctx.stroke();
    });
    ctx.globalAlpha=1;
    ctx.fillStyle=FCOL[i];
    ctx.beginPath(); ctx.arc(xf,yf,3.4,0,Math.PI*2); ctx.fill();
    /* how far this field misses the sensor by */
    const b=Math.abs(aber(ap,0,h,dz)[0])*SCALE;
    const yc=yf+((yf-cy)/(xf-xPup))*(xSen-xf);
    ctx.strokeStyle=FCOL[i]; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(xSen,yc-b); ctx.lineTo(xSen,yc+b); ctx.stroke();
  });

  /* the sensor: flat, and it does not move */
  ctx.strokeStyle='#c3ccdb'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(xSen,cy-SENH); ctx.lineTo(xSen,cy+SENH); ctx.stroke();
  label(ctx,T.imgPlane,xSen-12,cy+SENH+15,'#c3ccdb',10.5);
  label(ctx,T.note,x0,H-7,'#55617a',10);
}

function drawSpots(dz,ap){
  const {ctx,W,H}=fit(document.getElementById('cvS'));
  ctx.clearRect(0,0,W,H);
  const ext=refExtent()*1.08, n=FIELDS.length, gap=12, top=30;
  const box=Math.min(H-top-30,(W-24-(n-1)*gap)/n), x0=(W-(box*n+gap*(n-1)))/2;
  label(ctx,T.field,x0,18,'#7f93b2',11);
  FIELDS.forEach((h,i)=>{
    const cx=x0+i*(box+gap)+box/2, cy=top+box/2, s=box/2/ext;
    const r=Math.abs(aber(ap,0,h,dz)[0])*s;
    ctx.strokeStyle=FCOL[i]; ctx.globalAlpha=.55; ctx.lineWidth=1;
    ctx.strokeRect(cx-box/2,cy-box/2,box,box); ctx.globalAlpha=1;
    ctx.fillStyle=FCOL[i]; ctx.globalAlpha=.35;
    ctx.beginPath(); ctx.arc(cx,cy,Math.max(r,0.9),0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1; ctx.strokeStyle=FCOL[i]; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.arc(cx,cy,Math.max(r,0.9),0,Math.PI*2); ctx.stroke();
    label(ctx,h.toFixed(2),cx-12,top+box+16,r<1.2?'#e8edf6':'#55617a',10.5);
  });
}

const rap=document.getElementById('rap'), rz=document.getElementById('rz');
function draw(){
  const ap=+rap.value, dz=+rz.value;
  document.getElementById('oap').textContent=ap.toFixed(2);
  document.getElementById('oz').textContent=dz.toFixed(2);
  drawPath(dz,ap); drawSpots(dz,ap);
  const hs=-dz/D;
  document.getElementById('ro').textContent =
    T.ro1+'\n'+(hs>=0 && hs<=1 ? `${T.ro2} ${Math.sqrt(hs).toFixed(2)}` : T.nowhere);
}
[rap,rz].forEach(el=>el.addEventListener('input',draw));
let rzT;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(draw,120);});
draw();
</script>
</body>
</html>
